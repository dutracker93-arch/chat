<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCADE HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #1C453C;
    --rust: #744234;
    --green-bright: #2a6b5c;
    --rust-bright: #a05a45;
    --cream: #e8d5b0;
    --scanline-gap: 4px;
  }

  * { margin:0; padding:0; box-sizing:border-box; border-radius:0 !important; }

  body {
    background: #080808;
    color: var(--cream);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  /* CRT scanlines */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background: repeating-linear-gradient(0deg, transparent, transparent calc(var(--scanline-gap) - 1px), rgba(0,0,0,0.2) var(--scanline-gap));
    pointer-events:none;
    z-index:9999;
  }

  /* ── ARCADE BG ── */
  .arcade-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  /* grid floor */
  .arcade-bg::before {
    content:'';
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(28,69,60,0.12) 60px),
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(28,69,60,0.12) 60px),
      #080808;
  }

  /* perspective grid lines at bottom */
  .grid-floor {
    position:absolute;
    bottom:0; left:0; right:0;
    height:55%;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0%,
        transparent calc(5% - 1px),
        rgba(28,69,60,0.25) 5%
      ),
      repeating-linear-gradient(
        180deg,
        transparent 0%,
        transparent calc(8% - 1px),
        rgba(28,69,60,0.18) 8%
      );
    transform: perspective(400px) rotateX(35deg);
    transform-origin: bottom center;
    opacity: 0.6;
  }

  /* floating pixel shapes */
  .pixel {
    position:absolute;
    background: var(--green);
    opacity: 0.12;
    animation: floatPixel linear infinite;
  }
  .pixel:nth-child(1)  { width:8px;  height:8px;  top:15%; left:8%;   animation-duration:18s; animation-delay:-2s; }
  .pixel:nth-child(2)  { width:4px;  height:4px;  top:40%; left:20%;  animation-duration:22s; animation-delay:-7s; background:var(--rust); opacity:0.15; }
  .pixel:nth-child(3)  { width:12px; height:4px;  top:60%; left:5%;   animation-duration:15s; animation-delay:-3s; }
  .pixel:nth-child(4)  { width:6px;  height:6px;  top:25%; left:75%;  animation-duration:20s; animation-delay:-10s; background:var(--rust); opacity:0.1; }
  .pixel:nth-child(5)  { width:4px;  height:12px; top:70%; left:85%;  animation-duration:17s; animation-delay:-5s; }
  .pixel:nth-child(6)  { width:8px;  height:8px;  top:10%; left:50%;  animation-duration:25s; animation-delay:-12s; background:var(--rust); opacity:0.08; }
  .pixel:nth-child(7)  { width:4px;  height:4px;  top:80%; left:40%;  animation-duration:19s; animation-delay:-8s; }
  .pixel:nth-child(8)  { width:10px; height:4px;  top:35%; left:90%;  animation-duration:23s; animation-delay:-1s; background:var(--rust); opacity:0.12; }

  @keyframes floatPixel {
    0%   { transform: translateY(0) rotate(0deg); opacity:0.12; }
    50%  { opacity: 0.2; }
    100% { transform: translateY(-80px) rotate(180deg); opacity:0; }
  }

  /* ── LAYOUT ── */
  .page {
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* top logo bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 0 18px;
    border-bottom: 2px solid var(--rust);
    background: rgba(8,8,8,0.85);
    position: relative;
  }

  .logo {
    font-weight: 900;
    font-size: 2rem;
    letter-spacing: 0.25em;
    color: var(--cream);
    text-shadow: 0 0 10px var(--rust-bright), 3px 3px 0 var(--rust);
  }
  .logo span { color: var(--rust-bright); }

  /* center login panel */
  .center {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 30px 20px 60px;
  }

  .panel {
    width: 100%;
    max-width: 420px;
    background: rgba(10,10,10,0.92);
    border: 1px solid var(--rust);
    box-shadow: 0 0 0 1px rgba(28,69,60,0.4), inset 0 0 40px rgba(28,69,60,0.05), 0 20px 60px rgba(0,0,0,0.7);
    padding: 36px 32px 32px;
    position: relative;
  }

  /* panel corner brackets */
  .panel::before, .panel::after {
    content:'';
    position:absolute;
    width:16px; height:16px;
    border-color: var(--green-bright);
    border-style: solid;
    opacity:0.7;
  }
  .panel::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .panel::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  /* tab switcher */
  .tabs {
    display:grid;
    grid-template-columns:1fr 1fr;
    border: 1px solid var(--rust);
    margin-bottom: 28px;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: rgba(232,213,176,0.6);
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .tab-btn:first-child { border-right: 1px solid var(--rust); }

  .tab-btn.active {
    background: var(--rust);
    color: var(--cream);
  }

  /* fields */
  .field-group {
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom: 24px;
  }

  .field {
    position:relative;
  }

  .field input {
    width:100%;
    background: rgba(28,69,60,0.08);
    border: 1px solid rgba(116,66,52,0.5);
    color: var(--cream);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.9rem;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  .field input::placeholder { color: rgba(232,213,176,0.3); }

  .field input:focus {
    border-color: var(--green-bright);
    background: rgba(28,69,60,0.15);
  }

  .field .eye {
    position:absolute;
    right:12px; top:50%;
    transform:translateY(-50%);
    background:none; border:none;
    color:rgba(232,213,176,0.5);
    cursor:pointer; font-size:0.75rem;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    padding:0;
    transition: color 0.1s;
  }
  .field .eye:hover { color: var(--cream); }

  /* label above */
  .field-label {
    font-size:0.75rem;
    font-weight: 600;
    letter-spacing:0.1em;
    color:rgba(232,213,176,0.7);
    text-transform:uppercase;
    margin-bottom:6px;
  }

  /* submit btn */
  .submit-btn {
    width:100%;
    background: var(--rust);
    border: none;
    color: var(--cream);
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 15px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background 0.15s;
    margin-bottom: 14px;
  }

  .submit-btn:hover {
    background: var(--green);
  }

  /* terms */
  .terms-row {
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }

  .terms-row input[type=checkbox] {
    width:16px; height:16px;
    accent-color: var(--rust);
    cursor:pointer;
    flex-shrink:0;
  }

  .terms-row label {
    font-size:0.75rem;
    color:rgba(232,213,176,0.7);
    cursor:pointer;
  }

  .terms-row label a {
    color: var(--rust-bright);
    text-decoration:none;
    font-weight: 600;
  }

  /* status bar */
  .status-bar {
    position:fixed;
    bottom:0; left:0; right:0;
    background:rgba(28,69,60,0.95);
    border-top:1px solid var(--rust);
    display:flex;
    align-items:center;
    padding:8px 18px;
    font-size:0.7rem;
    font-weight: 600;
    letter-spacing:0.1em;
    color:rgba(232,213,176,0.7);
    z-index:200;
    gap:20px;
  }
  .sdot { width:8px; height:8px; background:var(--rust-bright); animation:blink 1s step-end infinite; flex-shrink:0; }
  .status-bar .sr { margin-left:auto; display:flex; gap:18px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* forgot */
  .forgot {
    text-align:center;
    font-size:0.75rem;
    letter-spacing:0.05em;
    color:rgba(232,213,176,0.6);
    margin-top:10px;
  }
  .forgot a { color:var(--rust-bright); text-decoration:none; font-weight: 600; }
  .forgot a:hover { color:var(--cream); }

  /* hidden panels */
  .form-panel { display:none; }
  .form-panel.active { display:block; }

  /* error msg */
  .err-msg {
    font-size:0.8rem;
    font-weight: 600;
    color:var(--rust-bright);
    margin-top: -8px;
    margin-bottom: 8px;
    display:none;
    background: rgba(116,66,52,0.1);
    padding: 10px;
    border: 1px solid var(--rust);
  }
  .err-msg.show { display:block; }
  
  .success-msg {
    font-size:0.8rem;
    font-weight: 600;
    color: var(--green-bright);
    margin-top: -8px;
    margin-bottom: 8px;
    display:none;
    background: rgba(28,69,60,0.2);
    padding: 10px;
    border: 1px solid var(--green-bright);
  }
  .success-msg.show { display:block; }
</style>
</head>
<body>

<div class="arcade-bg">
  <div class="grid-floor"></div>
  <div class="pixel"></div>
  <div class="pixel"></div>
  <div class="pixel"></div>
  <div class="pixel"></div>
  <div class="pixel"></div>
  <div class="pixel"></div>
  <div class="pixel"></div>
  <div class="pixel"></div>
</div>

<div class="page">

  <div class="top-bar">
    <div class="logo">ARCADE<span>HUB</span></div>
  </div>

  <div class="center">
    <div class="panel">

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">LOG IN</button>
        <button class="tab-btn" onclick="switchTab('signup')">SIGN UP</button>
      </div>

      <div class="form-panel active" id="login-panel">
        <div class="field-group">
          <div class="field">
            <div class="field-label">Username</div>
            <input type="text" id="l-user" placeholder="Enter your username" autocomplete="username">
          </div>
          <div class="field">
            <div class="field-label">Password</div>
            <input type="password" id="l-pass" placeholder="Enter your password" autocomplete="current-password">
            <button class="eye" onclick="togglePass('l-pass', this)">SHOW</button>
          </div>
          <div class="err-msg" id="l-err"></div>
          <div class="success-msg" id="l-succ"></div>
        </div>
        <button class="submit-btn" onclick="handleLogin()">CONTINUE</button>
        <div class="forgot"><a href="#">Forgot password?</a></div>
      </div>

      <div class="form-panel" id="signup-panel">
        <div class="field-group">
          <div class="field">
            <div class="field-label">Email Address</div>
            <input type="email" id="s-email" placeholder="player@arcade.hub">
          </div>
          <div class="field">
            <div class="field-label">Username</div>
            <input type="text" id="s-user" placeholder="Choose a username">
          </div>
          <div class="field">
            <div class="field-label">Password</div>
            <input type="password" id="s-pass" placeholder="Create a password">
            <button class="eye" onclick="togglePass('s-pass', this)">SHOW</button>
          </div>
          <div class="field">
            <div class="field-label">Confirm Password</div>
            <input type="password" id="s-pass2" placeholder="Confirm your password">
            <button class="eye" onclick="togglePass('s-pass2', this)">SHOW</button>
          </div>
          <div class="err-msg" id="s-err"></div>
          <div class="success-msg" id="s-succ"></div>
        </div>
        <div class="terms-row">
          <input type="checkbox" id="terms">
          <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
        </div>
        <button class="submit-btn" onclick="handleSignup()">CREATE ACCOUNT</button>
      </div>

    </div>
  </div>

</div>

<div class="status-bar">
  <div class="sdot"></div>
  <span>SYS: ONLINE</span>
  <div class="sr">
    <span id="clock"></span>
    <span>P1 READY</span>
  </div>
</div>

<script>
  // ─── SUPABASE INITIALIZATION ───
  const SUPABASE_URL = 'https://tmfnmjciuoingrsbxnhr.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtZm5tamNpdW9pbmdyc2J4bmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NzYwMjMsImV4cCI6MjA4OTM1MjAyM30.L5s9X6fqtl-BbjWQ2IRsxkXqP0GPEXX5tajR159iYLA'; 

  // CHANGED: We named this "db" instead of "supabase" to prevent the script from crashing
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Clock
  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-US', { hour12: false });
  }
  tick(); setInterval(tick, 1000);

  // Tab switch
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => {
      b.classList.toggle('active', (tab==='login' && i===0) || (tab==='signup' && i===1));
    });
    document.getElementById('login-panel').classList.toggle('active', tab==='login');
    document.getElementById('signup-panel').classList.toggle('active', tab==='signup');
    
    // Clear messages on tab switch
    document.getElementById('l-err').classList.remove('show');
    document.getElementById('s-err').classList.remove('show');
    document.getElementById('l-succ').classList.remove('show');
    document.getElementById('s-succ').classList.remove('show');
  }

  // Toggle password visibility
  function togglePass(id, btn) {
    const inp = document.getElementById(id);
    const isPassword = inp.type === 'password';
    inp.type = isPassword ? 'text' : 'password';
    btn.textContent = isPassword ? 'HIDE' : 'SHOW';
    btn.style.opacity = isPassword ? '1' : '0.5';
  }

  // ─── LIVE LOG IN LOGIC ───
  async function handleLogin() {
    const u = document.getElementById('l-user').value.trim();
    const p = document.getElementById('l-pass').value;
    const err = document.getElementById('l-err');
    const succ = document.getElementById('l-succ');
    
    err.classList.remove('show');
    succ.classList.remove('show');

    if (!u || !p) { 
      err.textContent = 'Please fill in all fields.'; 
      err.classList.add('show'); 
      return; 
    }

    // 1. Look up the email connected to this username profile row
    const { data: profile, error: profileError } = await db
      .from('profiles')
      .select('email')
      .eq('username', u)
      .maybeSingle();

    if (!profile) {
      err.textContent = 'Invalid username or credentials.';
      err.classList.add('show');
      return;
    }

    // 2. Log in using the email we found and the user's password
    const { data, error: loginError } = await db.auth.signInWithPassword({
      email: profile.email,
      password: p
    });

    if (loginError) {
      err.textContent = 'Invalid password. Try again.';
      err.classList.add('show');
    } else {
      succ.textContent = 'Access Granted. Logging you in...';
      succ.classList.add('show');
    }
  }

  // ─── LIVE SIGN UP LOGIC ───
  async function handleSignup() {
    const e = document.getElementById('s-email').value.trim();
    const u = document.getElementById('s-user').value.trim();
    const p = document.getElementById('s-pass').value;
    const p2 = document.getElementById('s-pass2').value;
    const t = document.getElementById('terms').checked;
    const err = document.getElementById('s-err');
    const succ = document.getElementById('s-succ');
    
    err.classList.remove('show');
    succ.classList.remove('show');

    if (!e || !u || !p || !p2) { 
      err.textContent = 'Please fill in all fields.'; 
      err.classList.add('show'); 
      return; 
    }
    
    if (p !== p2) { 
      err.textContent = 'Passwords do not match.'; 
      err.classList.add('show'); 
      return; 
    }
    
    if (!t) { 
      err.textContent = 'You must accept the terms to continue.'; 
      err.classList.add('show'); 
      return; 
    }
    
    // 1. Check database if username is already taken
    const { data: existingUser, error: checkError } = await db
      .from('profiles')
      .select('username')
      .eq('username', u)
      .maybeSingle();

    if (existingUser) {
      err.textContent = 'That username is already taken. Please choose another.';
      err.classList.add('show');
      return;
    }

    // 2. Create standard credentials account
    const { data: authData, error: authError } = await db.auth.signUp({
      email: e,
      password: p
    });

    if (authError) {
      err.textContent = authError.message;
      err.classList.add('show');
      return;
    }

    // 3. Save custom username mapping to profiles table spreadsheet
    const { error: profileError } = await db
      .from('profiles')
      .insert([{ email: e, username: u }]);

    if (profileError) {
      err.textContent = 'Account created, but failed to map username.';
      err.classList.add('show');
    } else {
      succ.textContent = 'Account created successfully! Welcome, ' + u;
      succ.classList.add('show');
    }
  }
</script>
</body>
</html>
