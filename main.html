<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0d14;--bg2:#0f1320;--bg3:#141929;--bg4:#1a2035;
  --surface:#1e2640;--surface2:#252d48;--surface3:#2d3659;
  --accent:#5865f2;--accent2:#4752c4;--accent3:#7289da;
  --green:#23d160;--red:#ff4444;--yellow:#ffd700;--orange:#ff8c42;
  --text:#e8eaf6;--text2:#9fa8c7;--text3:#5c6584;
  --border:#1e2640;--border2:#2d3659;
  --msg-out:#5865f2;--msg-in:#1e2640;
  --radius:14px;--radius-sm:10px;--radius-lg:22px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}

/* ===== AUTH ===== */
.auth-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:var(--bg);animation:fadeIn .5s ease;
  position:relative;overflow:hidden;
}
.auth-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.18}
.orb1{width:500px;height:500px;background:#5865f2;top:-150px;left:-100px;animation:orbMove 9s ease-in-out infinite}
.orb2{width:350px;height:350px;background:#7289da;bottom:-80px;right:-60px;animation:orbMove 12s ease-in-out infinite reverse}
.orb3{width:250px;height:250px;background:#23d160;top:50%;left:60%;animation:orbMove 15s ease-in-out infinite 3s}
@keyframes orbMove{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.05)}66%{transform:translate(-15px,20px) scale(.95)}}

/* Grid overlay */
.auth-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(88,101,242,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(88,101,242,.04) 1px,transparent 1px);
  background-size:50px 50px;
}

.auth-card{
  position:relative;z-index:1;
  background:rgba(15,19,32,.92);
  border:1px solid rgba(88,101,242,.2);
  border-radius:28px;padding:52px 48px;width:440px;max-width:95vw;
  backdrop-filter:blur(24px);
  box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(88,101,242,.08),inset 0 1px 0 rgba(255,255,255,.05);
  animation:cardIn .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(50px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:36px;justify-content:center}
.logo-mark{
  width:52px;height:52px;border-radius:18px;
  background:linear-gradient(135deg,#5865f2,#7289da);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 8px 32px rgba(88,101,242,.5);
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{box-shadow:0 8px 32px rgba(88,101,242,.4)}50%{box-shadow:0 8px 48px rgba(88,101,242,.8),0 0 0 8px rgba(88,101,242,.1)}}
.logo-text{font-size:32px;font-weight:700;letter-spacing:-1px;background:linear-gradient(135deg,#e8eaf6 30%,#7289da);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.auth-title{font-size:24px;font-weight:600;text-align:center;margin-bottom:6px;color:var(--text)}
.auth-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:30px;line-height:1.5}

.field{margin-bottom:18px}
.field label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:8px}
.field input{
  width:100%;background:rgba(26,32,53,.8);
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:15px 18px;color:var(--text);font-family:'Sora',sans-serif;font-size:15px;
  transition:all .25s;outline:none;
}
.field input:focus{border-color:var(--accent);background:rgba(30,38,64,.9);box-shadow:0 0 0 4px rgba(88,101,242,.12)}
.field input::placeholder{color:var(--text3)}

.btn-primary{
  width:100%;padding:16px;border-radius:var(--radius-sm);border:none;
  background:linear-gradient(135deg,#5865f2,#7289da);
  color:#fff;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;
  cursor:pointer;transition:all .25s;letter-spacing:.3px;margin-top:6px;
  box-shadow:0 4px 20px rgba(88,101,242,.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(88,101,242,.5)}
.btn-primary:active{transform:translateY(0);box-shadow:0 2px 10px rgba(88,101,242,.3)}

.auth-switch{text-align:center;margin-top:22px;font-size:14px;color:var(--text2)}
.auth-switch a{color:var(--accent3);cursor:pointer;font-weight:600;text-decoration:none}
.auth-switch a:hover{text-decoration:underline}

.demo-hint{
  margin-top:20px;padding:12px 16px;background:rgba(88,101,242,.08);
  border:1px solid rgba(88,101,242,.15);border-radius:var(--radius-sm);
  font-size:12px;color:var(--text2);text-align:center;line-height:1.6;
}
.demo-hint code{background:rgba(88,101,242,.2);padding:2px 8px;border-radius:6px;color:var(--accent3);font-family:'JetBrains Mono',monospace;font-size:12px}

.err{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.25);border-radius:var(--radius-sm);padding:11px 15px;font-size:13px;color:#ff8080;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.suc{background:rgba(35,209,96,.1);border:1px solid rgba(35,209,96,.25);border-radius:var(--radius-sm);padding:11px 15px;font-size:13px;color:#5adf8a;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* ===== MAIN APP ===== */
.app-wrap{display:flex;height:100vh;overflow:hidden;animation:fadeIn .3s ease}

/* SIDEBAR */
.sidebar{
  width:290px;min-width:290px;background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}

.sb-header{padding:18px 14px 12px;border-bottom:1px solid var(--border)}

.me-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:var(--radius-sm);
  transition:background .2s;margin-bottom:10px;
}
.me-row:hover{background:rgba(255,255,255,.04)}

.ava{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;position:relative;
}
.ava.sz-sm{width:32px;height:32px;font-size:12px}
.ava.sz-md{width:42px;height:42px;font-size:16px}
.ava.sz-lg{width:50px;height:50px;font-size:20px}
.ava .dot{
  position:absolute;bottom:1px;right:1px;
  width:10px;height:10px;border-radius:50%;
  background:var(--green);border:2px solid var(--bg2);
}

.me-info{flex:1;min-width:0}
.me-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-handle{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}

.logout-btn{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);
  background:none;color:var(--text3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:all .2s;flex-shrink:0;
}
.logout-btn:hover{background:rgba(255,68,68,.15);color:var(--red);border-color:rgba(255,68,68,.3)}

.tabs{display:flex;gap:3px;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:3px}
.tab{
  flex:1;padding:8px 4px;border-radius:8px;border:none;background:none;
  color:var(--text2);font-family:'Sora',sans-serif;font-size:12px;font-weight:500;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab:hover{background:rgba(255,255,255,.06);color:var(--text)}
.tab.on{background:var(--surface2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tab-icon{font-size:15px}
.chip{
  background:var(--red);color:#fff;border-radius:10px;
  font-size:10px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;
  animation:pop .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* Search */
.sb-search{padding:10px 14px;position:relative}
.sb-search input{
  width:100%;background:var(--surface);border:1px solid transparent;
  border-radius:var(--radius-sm);padding:9px 12px 9px 36px;
  color:var(--text);font-family:'Sora',sans-serif;font-size:13px;
  outline:none;transition:all .2s;
}
.sb-search input:focus{border-color:var(--border2);background:var(--surface2)}
.sb-search input::placeholder{color:var(--text3)}
.sb-search .si{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}

.sec-lbl{
  padding:10px 18px 5px;font-size:10px;font-weight:800;
  color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;
}

/* Conversation list */
.conv-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.conv-list::-webkit-scrollbar{width:3px}
.conv-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.conv-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:var(--radius-sm);cursor:pointer;
  transition:all .2s;
}
.conv-row:hover{background:rgba(255,255,255,.05)}
.conv-row.active{background:var(--surface2)}
.conv-body{flex:1;min-width:0}
.conv-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-prev{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.conv-time{font-size:11px;color:var(--text3)}
.unread-dot{background:var(--accent);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}

/* Friends panel */
.fr-panel{flex:1;overflow-y:auto;padding:4px 8px 8px}
.fr-panel::-webkit-scrollbar{width:3px}
.fr-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.add-fr-btn{
  margin:8px 8px 4px;width:calc(100% - 16px);
  padding:11px;border-radius:var(--radius-sm);
  border:1px dashed rgba(88,101,242,.35);background:none;
  color:var(--accent3);font-family:'Sora',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.add-fr-btn:hover{background:rgba(88,101,242,.1);border-color:var(--accent);color:var(--text)}

.fr-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-sm);
  transition:background .2s;
}
.fr-row:hover{background:rgba(255,255,255,.04)}
.fr-info{flex:1;min-width:0}
.fr-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-sub{font-size:11px;color:var(--text3)}
.fr-acts{display:flex;gap:5px;flex-shrink:0}

.act-btn{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);
  background:none;color:var(--text2);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.act-btn.ok:hover{background:rgba(35,209,96,.15);color:var(--green);border-color:var(--green)}
.act-btn.no:hover{background:rgba(255,68,68,.15);color:var(--red);border-color:var(--red)}
.act-btn.go:hover{background:rgba(88,101,242,.15);color:var(--accent3);border-color:var(--accent)}

.tag{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;flex-shrink:0}
.tag.in{background:rgba(35,209,96,.12);color:var(--green)}
.tag.out{background:rgba(255,140,66,.12);color:var(--orange)}

.empty-state{padding:32px 16px;text-align:center;color:var(--text3);font-size:13px;line-height:1.7}

/* ===== CHAT AREA ===== */
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

.chat-hdr{
  padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;background:var(--bg2);
  flex-shrink:0;box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.hdr-info{flex:1}
.hdr-name{font-size:16px;font-weight:600;color:var(--text)}
.hdr-status{font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px;margin-top:1px}
.hdr-status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}
.hdr-btns{display:flex;gap:6px}
.hdr-btn{
  width:36px;height:36px;border-radius:var(--radius-sm);
  border:1px solid var(--border2);background:none;color:var(--text2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all .2s;
}
.hdr-btn:hover{background:var(--surface);color:var(--text)}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:20px 20px 10px;display:flex;flex-direction:column;gap:1px}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

.date-sep{
  display:flex;align-items:center;gap:12px;
  color:var(--text3);font-size:11px;font-weight:600;letter-spacing:.5px;
  margin:16px 0;
}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--border)}

.msg-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:2px}
.msg-row.out{flex-direction:row-reverse}

.msg-ava{flex-shrink:0}
.msg-ava-spacer{width:32px;flex-shrink:0}

.bubble{
  max-width:62%;padding:10px 14px 8px;position:relative;
  font-size:14px;line-height:1.55;word-break:break-word;
  animation:bubbleIn .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes bubbleIn{from{opacity:0;transform:scale(.82) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.bubble.in{
  background:var(--surface);color:var(--text);
  border-radius:18px 18px 18px 4px;
}
.bubble.out{
  background:linear-gradient(135deg,#5865f2,#6876f5);
  color:#fff;border-radius:18px 18px 4px 18px;
  box-shadow:0 2px 12px rgba(88,101,242,.25);
}

.msg-time{font-size:11px;opacity:.6;margin-top:5px;display:flex;align-items:center;gap:4px}
.bubble.out .msg-time{justify-content:flex-end}
.ticks{font-size:13px}
.ticks.read{color:#a5d6ff}

.sender-lbl{font-size:11px;font-weight:700;color:var(--accent3);margin-bottom:3px;padding-left:2px}

/* ===== INPUT ===== */
.input-zone{
  padding:14px 18px;background:var(--bg2);
  border-top:1px solid var(--border);flex-shrink:0;
}
.input-box{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--radius-lg);padding:8px 10px 8px 16px;
  transition:all .25s;
}
.input-box:focus-within{border-color:rgba(88,101,242,.5);box-shadow:0 0 0 3px rgba(88,101,242,.08)}
.msg-ta{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:'Sora',sans-serif;font-size:14px;
  resize:none;max-height:120px;min-height:24px;
  line-height:1.55;padding:3px 0;
}
.msg-ta::placeholder{color:var(--text3)}
.ia{display:flex;gap:4px;align-items:flex-end}
.ia-btn{
  width:34px;height:34px;border-radius:50%;border:none;background:none;
  color:var(--text3);cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;
}
.ia-btn:hover{background:var(--surface2);color:var(--text)}
.send{
  width:38px;height:38px;border-radius:50%;border:none;flex-shrink:0;
  background:linear-gradient(135deg,#5865f2,#7289da);
  color:#fff;cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 3px 12px rgba(88,101,242,.4);
}
.send:hover{transform:scale(1.1);box-shadow:0 5px 20px rgba(88,101,242,.55)}
.send:active{transform:scale(.93)}

/* ===== EMPTY STATE ===== */
.no-chat{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
}
.no-chat-icon{font-size:72px;animation:float 4s ease-in-out infinite;opacity:.3}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.no-chat h2{font-size:24px;font-weight:600;color:var(--text2)}
.no-chat p{font-size:14px;color:var(--text3);text-align:center;max-width:280px;line-height:1.6}

/* ===== MODAL ===== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:999;display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;backdrop-filter:blur(6px);
}
.modal{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:22px;padding:34px;width:380px;max-width:92vw;
  animation:cardIn .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.modal h3{font-size:20px;font-weight:700;margin-bottom:6px;color:var(--text)}
.modal p{font-size:13px;color:var(--text2);margin-bottom:22px;line-height:1.55}
.modal-row{display:flex;gap:10px;margin-top:18px}
.btn-sec{
  flex:1;padding:13px;border-radius:var(--radius-sm);
  border:1px solid var(--border2);background:none;
  color:var(--text2);font-family:'Sora',sans-serif;font-size:14px;
  cursor:pointer;transition:all .2s;
}
.btn-sec:hover{background:var(--surface);color:var(--text)}
.btn-acc{
  flex:1;padding:13px;border-radius:var(--radius-sm);border:none;
  background:linear-gradient(135deg,#5865f2,#7289da);
  color:#fff;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.btn-acc:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(88,101,242,.35)}
.btn-acc:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:28px;right:28px;z-index:2000;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:14px;padding:14px 20px;font-size:13px;color:var(--text);
  animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:10px;max-width:320px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Typing */
.typing-bubble{
  display:inline-flex;gap:4px;padding:12px 16px;
  background:var(--surface);border-radius:18px 18px 18px 4px;
  animation:bubbleIn .2s ease;
}
.t-dot{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:tdot 1.4s ease-in-out infinite}
.t-dot:nth-child(2){animation-delay:.2s}
.t-dot:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}

/* Emoji picker */
.epicker{
  position:absolute;bottom:76px;right:18px;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:16px;padding:14px;
  display:flex;flex-wrap:wrap;gap:4px;width:248px;z-index:100;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  animation:cardIn .2s ease;
}

@media(max-width:640px){
  .sidebar{width:68px;min-width:68px}
  .me-info,.sb-search,.sec-lbl,.conv-body,.conv-side,.me-handle,.tabs span{display:none}
  .me-row{justify-content:center}
  .tab{padding:10px 0}
  .tab-icon{font-size:18px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ───────── DATABASE ─────────
const DB = {
  get users(){ return JSON.parse(localStorage.getItem('nx_u')||'{}') },
  set users(v){ localStorage.setItem('nx_u',JSON.stringify(v)) },
  get messages(){ return JSON.parse(localStorage.getItem('nx_m')||'{}') },
  set messages(v){ localStorage.setItem('nx_m',JSON.stringify(v)) },

const convKey  = (a,b) => [a,b].sort().join('_');
const getMsgs  = (a,b) => DB.messages[convKey(a,b)] || [];
const getUser  = u => DB.users[u] || {displayName:u};
const getFr    = u => DB.friends[u] || [];
const initials = u => getUser(u).displayName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

const COLORS = ['#5865f2','#23d160','#ff8c42','#e84393','#00b4d8','#ffd700','#c77dff','#ff6b6b'];
const color  = u => COLORS[u.split('').reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];

function fmtShort(ts){
  const d=new Date(ts), n=new Date(), diff=n-d;
  if(diff<60000)  return 'now';
  if(diff<3600000) return Math.floor(diff/60000)+'m';
  if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }
function fmtDate(ts){
  const d=new Date(ts), n=new Date();
  if(d.toDateString()===n.toDateString()) return 'Today';
  const y=new Date(n); y.setDate(n.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
}

function getUnread(user){
  return getFr(user).reduce((sum,f)=>{
    return sum + getMsgs(user,f).filter(m=>m.from!==user&&!m.read).length;
  },0);
}
function getRequests(user){ return DB.requests.filter(r=>r.to===user&&r.status==='pending') }
function getOutgoing(user){ return DB.requests.filter(r=>r.from===user&&r.status==='pending') }

// ───────── TOAST ─────────
function toast(msg, icon='✅'){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span style="font-size:18px">${icon}</span><span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateY(20px)'; setTimeout(()=>el.remove(),300); }, 2800);
}

function renderMsgs(msgs){
  if(!msgs.length) return `<div style="text-align:center;color:var(--text3);font-size:13px;padding:30px 0">No messages yet. Say hello! 👋</div>`;
  let html='', lastDate='';
  for(let i=0;i<msgs.length;i++){
    const m=msgs[i], isOut=m.from===me;
    const d=new Date(m.time).toDateString();
    if(d!==lastDate){ html+=`<div class="date-sep">${fmtDate(m.time)}</div>`; lastDate=d; }
    const showAva = !isOut && (i===msgs.length-1||msgs[i+1].from===me);
    const showLbl = !isOut && (i===0||msgs[i-1].from===me);
    const isLast  = i===msgs.length-1||msgs[i+1].from!==m.from;
    const c2=color(m.from);
    html+=`<div class="msg-row ${isOut?'out':''}">
      ${!isOut?(showAva?`<div class="ava msg-ava sz-sm" style="background:linear-gradient(135deg,${c2},${c2}99)">${initials(m.from)}</div>`:`<div class="msg-ava-spacer"></div>`):''}
      <div>
        ${showLbl&&!isOut?`<div class="sender-lbl">${getUser(m.from).displayName}</div>`:''}

          <div class="msg-time">${fmtTime(m.time)}${isOut?`<span class="ticks ${m.read?'read':''}">✓✓</span>`:''}</div>
        </div>
      </div>
    </div>`;
  }
  return html;
}

function doLogin(){
  const u=document.getElementById('ain-u')?.value.trim().toLowerCase();
  const p=document.getElementById('ain-p')?.value;
  if(!u||!p){amsg('Please fill in both fields','err');return;}
  const users=DB.users;
  if(!users[u]){amsg('Username not found','err');return;}
  if(users[u].password!==p){amsg('Wrong password','err');return;}
  me=u; render();
}

function doSignup(){
  const n=document.getElementById('ain-n')?.value.trim();
  const u=document.getElementById('ain-u')?.value.trim().toLowerCase();
  const p=document.getElementById('ain-p')?.value;
  if(!n||!u||!p){amsg('Please fill in all fields','err');return;}
  if(p.length<6){amsg('Password needs at least 6 characters','err');return;}
  if(!/^[a-z0-9_]+$/.test(u)){amsg('Username: only letters, numbers, underscores','err');return;}
  const users=DB.users;
  if(users[u]){amsg('Username already taken, try another','err');return;}
  users[u]={displayName:n,password:p};
  DB.users=users;
  const f=DB.friends; f[u]=[]; DB.friends=f;
  amsg('Account created! Signing you in... ✅','suc');
  setTimeout(()=>{me=u;render();},700);
}

function closeModal(){ document.getElementById('overlay')?.remove(); modal=null; }

function mmsg(html,cls){ const el=document.getElementById('mmsg'); if(el) el.innerHTML=`<div class="${cls}">${html}</div>`; }

function sendFriendReq(){
  const t=document.getElementById('m-u')?.value.trim().toLowerCase();
  if(!t){mmsg('Enter a username','err');return;}
  if(t===me){mmsg("You can't add yourself 😅",'err');return;}
  const users=DB.users;
  if(!users[t]){mmsg('User not found. Check the spelling.','err');return;}
  if(getFr(me).includes(t)){mmsg('Already friends!','err');return;}
  const reqs=DB.requests;
  if(reqs.find(r=>(r.from===me&&r.to===t&&r.status==='pending')||(r.from===t&&r.to===me&&r.status==='pending'))){
    mmsg('Request already pending','err');return;
  }
  reqs.push({id:Date.now(),from:me,to:t,status:'pending'});
  DB.requests=reqs;
  closeModal(); toast(`Request sent to @${t}!`,'📨'); render();
}

function acceptReq(from){
  const reqs=DB.requests;
  const r=reqs.find(x=>x.from===from&&x.to===me&&x.status==='pending');
  if(r) r.status='accepted';
  DB.requests=reqs;
  const f=DB.friends;
  if(!f[me])f[me]=[]; if(!f[from])f[from]=[];
  if(!f[me].includes(from))f[me].push(from);
  if(!f[from].includes(me))f[from].push(me);
  DB.friends=f;
  toast(`You and @${from} are now friends! 🎉`,'🎉'); render();
}

function declineReq(from){
  const reqs=DB.requests;
  const r=reqs.find(x=>x.from===from&&x.to===me&&x.status==='pending');
  if(r) r.status='declined';
  DB.requests=reqs; render();
}

function sendMsg(){
  const ta=document.getElementById('msg-ta');
  if(!ta||!chat) return;
  const txt=ta.value.trim(); if(!txt) return;
  const key=convKey(me,chat);
  const m=DB.messages;
  if(!m[key]) m[key]=[];
  const msgId=Date.now();
  m[key].push({id:msgId,from:me,text:txt,time:Date.now(),read:false});
  DB.messages=m;
  ta.value=''; ta.style.height='auto';

  const area=document.getElementById('msgs');
  if(area){ area.innerHTML=renderMsgs(DB.messages[key]); area.scrollTop=area.scrollHeight; }
  updateConvList();

  // Simulate reply
  if(Math.random()<0.55){
    const replies=["Got it! 👍","Sure thing!","That's great!","Interesting...","Haha 😄","Makes sense!","On it!","👀 nice","Tell me more!","Cool cool 😎","Absolutely!","Love it 🔥"];
    setTimeout(()=>{
      const m2=DB.messages;
      if(!m2[key]) return;
      m2[key].push({id:Date.now(),from:chat,text:replies[Math.floor(Math.random()*replies.length)],time:Date.now(),read:true});
      DB.messages=m2;
      const a2=document.getElementById('msgs');
      if(a2){ a2.innerHTML=renderMsgs(m2[key]); a2.scrollTop=a2.scrollHeight; }
      updateConvList();
    }, 900+Math.random()*1800);
  }
}

function updateConvList(){
  const cl=document.getElementById('conv-list');
  if(!cl) return;
  const tmp=document.createElement('div');
  tmp.innerHTML=renderConvList();
  const nl=tmp.querySelector('#conv-list');
  if(nl){ cl.innerHTML=nl.innerHTML; bindConvItems(); }
}

// ───────── BIND ─────────
function bind(){
  if(!me){ bindAuth(); } else { bindApp(); }
  if(modal) { /* modal handles own binding */ }
}

function bindAuth(){
  document.getElementById('goto-signup')?.addEventListener('click',()=>{
    document.getElementById('auth-body').innerHTML=signupForm(); bindAuth();
  });
  document.getElementById('goto-login')?.addEventListener('click',()=>{
    document.getElementById('auth-body').innerHTML=loginForm(); bindAuth();
  });
  document.getElementById('btn-login')?.addEventListener('click', doLogin);
  document.getElementById('btn-signup')?.addEventListener('click', doSignup);
  ['ain-u','ain-p','ain-n'].forEach(id=>{
    document.getElementById(id)?.addEventListener('keydown',e=>{
      if(e.key!=='Enter') return;
      if(document.getElementById('btn-login')) doLogin();
      else doSignup();
    });
  });
}

function bindApp(){
  document.getElementById('btn-logout')?.addEventListener('click',e=>{e.stopPropagation();me=null;chat=null;tab='chats';q='';render();});
  document.getElementById('t-chats')?.addEventListener('click',()=>{tab='chats';render();});
  document.getElementById('t-friends')?.addEventListener('click',()=>{tab='friends';render();});
  document.getElementById('btn-add-fr')?.addEventListener('click', openAddFriend);
  document.getElementById('q-input')?.addEventListener('input',e=>{q=e.target.value; updateConvList();});

  bindConvItems();
  bindFriendActions();
  bindChatInput();

  const area=document.getElementById('msgs');
  if(area) setTimeout(()=>area.scrollTop=area.scrollHeight,30);
}

function bindConvItems(){
  document.querySelectorAll('.conv-row[data-friend]').forEach(el=>{
    el.addEventListener('click',()=>{chat=el.dataset.friend; render();});
  });
}

function bindFriendActions(){
  document.querySelectorAll('[data-accept]').forEach(el=>el.addEventListener('click',()=>acceptReq(el.dataset.accept)));
  document.querySelectorAll('[data-decline]').forEach(el=>el.addEventListener('click',()=>declineReq(el.dataset.decline)));
  document.querySelectorAll('[data-chat]').forEach(el=>el.addEventListener('click',()=>{chat=el.dataset.chat;tab='chats';render();}));
}

function bindChatInput(){
  const ta=document.getElementById('msg-ta');
  if(!ta) return;
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';});
  ta.focus();

  document.getElementById('send-btn')?.addEventListener('click', sendMsg);

  document.getElementById('emoji-btn')?.addEventListener('click',e=>{
    e.stopPropagation();
    document.getElementById('epicker')?.remove();
    const emojis=['😊','😂','❤️','👍','🎉','🔥','✨','😎','🤔','👋','🙏','😅','💯','🚀','😍','🥳','😇','🤩','💪','🎯'];
    const pick=document.createElement('div');
    pick.id='epicker'; pick.className='epicker';
    emojis.forEach(em=>{
      const b=document.createElement('button');
      b.textContent=em;
      b.style.cssText='background:none;border:none;font-size:22px;cursor:pointer;padding:5px;border-radius:8px;transition:background .15s;';
      b.onmouseenter=()=>b.style.background='var(--surface3)';
      b.onmouseleave=()=>b.style.background='none';
      b.addEventListener('click',()=>{
        const t2=document.getElementById('msg-ta');
        if(t2){t2.value+=em;t2.focus();}
        pick.remove();
      });
      pick.appendChild(b);
    });
    const cw=document.querySelector('.chat-wrap');
    if(cw){cw.style.position='relative';cw.appendChild(pick);}
    document.addEventListener('click',()=>pick.remove(),{once:true});
  });
}

// ───────── GO ─────────
render();
</script>
</body>
</html>
